<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5bits.one</title>
    <link rel="icon" type="image/svg+xml" href="5bitsone-icon.svg">
    <style>
      :root  {
          --bg-color: #f2f2f2;
          --fg-color: #222222;
          --font-family-monospace: 'Courier New', monospace;
      }
      body {
          margin: 0;
          padding: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: var(--font-family-monospace);
          background-color: var(--bg-color);
          color: var(--fg-color);
      }
      .landing-container {
          text-align: center;
      }
      .logo {
          pointer-events: none;
          user-select:none;
      }
      .margin-0 {
          margin: 0;
      }
      @media (prefers-color-scheme: dark) {
          body {
              background-color: var(--fg-color);
              color: var(--bg-color);
          }
      }
    </style>
  </head>
  <body>
    <main class="landing-container" role="main">
      <img src="5bitsone.svg" alt="5bits.one logo" class="logo"/>
      <p>5bits.one</p>
    </main>
  </body>
</html>
